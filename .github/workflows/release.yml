name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write # For npm Trusted Publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: get_version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag in the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.get_version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with OIDC support
        run: |
          npm install --global npm@11 --registry=https://registry.npmjs.org/
          npm --version

      - name: Install dependencies
        run: pnpm install
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Update package versions
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Update root package.json
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          # Update all package versions
          for pkg in packages/*/package.json; do
            jq ".version = \"$VERSION\"" "$pkg" > "$pkg.tmp" && mv "$pkg.tmp" "$pkg"
          done
          echo "Updated all packages to version $VERSION"

      - name: Build all packages
        run: pnpm build

      - name: Generate root changelog
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          TAG_NAME="v$VERSION"

          # Try to get previous tag, fallback to first commit if no tags exist
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD 2>/dev/null || echo "HEAD~20")
          fi

          {
            echo "# Changelog"
            echo ""
            echo "## [$VERSION] - $(date +%Y-%m-%d)"
            echo ""

            if [ "$PREVIOUS_TAG" = "$(git rev-list --max-parents=0 HEAD 2>/dev/null)" ]; then
              echo "### Initial Release"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges
            elif [ -n "$PREVIOUS_TAG" ]; then
              echo "### Changes since $PREVIOUS_TAG"
              echo ""
              git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              echo "### Changes"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo "Full Changelog: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG:-main}...$TAG_NAME"
          } > CHANGELOG.md

          cat CHANGELOG.md

      - name: Publish to npm with OIDC
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # Publish each package, skipping those already published at this version
          for pkg_dir in packages/*/; do
            pkg_name=$(jq -r .name "$pkg_dir/package.json")
            # Skip private packages
            is_private=$(jq -r '.private // false' "$pkg_dir/package.json")
            if [ "$is_private" = "true" ]; then
              echo "Skipping private package: $pkg_name"
              continue
            fi
            # Check if this version is already published
            if npm view "$pkg_name@$VERSION" version >/dev/null 2>&1; then
              echo "Skipping $pkg_name@$VERSION (already published)"
              continue
            fi
            echo "Publishing $pkg_name@$VERSION ..."
            # pnpm rewrites workspace protocols; npm 11 performs OIDC authentication.
            publish_dir=$(mktemp -d "$RUNNER_TEMP/tinyimg-publish.XXXXXX")
            pnpm --dir "$pkg_dir" pack --pack-destination "$publish_dir"
            npm publish "$publish_dir"/*.tgz --access public
          done
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          body_path: CHANGELOG.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
